# Builds the app in the cloud every time you push to GitHub.
# Download the APKs from the run's "Artifacts" section.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Shows the signing fingerprint (SHA-1) you give to Firebase
      - name: Print SHA-1
        run: keytool -list -v -keystore app/nexus-debug.keystore -storepass android -alias androiddebugkey | grep SHA1

      - name: Check google-services.json
        run: test -f app/google-services.json || (echo "Missing app/google-services.json - download it from Firebase and put it in the app/ folder" && exit 1)

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # The one to share with friends: faster and not a debug build
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-release-apk
          path: app/build/outputs/apk/release/app-release.apk
